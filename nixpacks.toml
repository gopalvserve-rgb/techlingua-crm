# Nixpacks plan for the API service (repo root has no package.json — monorepo: api/ + web/)
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.build]
cmds = [
  "cd web && npm ci && npm run build",
  "rm -rf api/public && mkdir -p api/public && cp -r web/dist/. api/public/",
  "cd api && npm ci && npm run build"
]

[start]
cmd = "cd api && node dist/database/migrate.js && node dist/main.js"
